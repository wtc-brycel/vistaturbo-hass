name: "Vista Turbo RS232"
version: "0.2.6-rc.17"
slug: "vista128_bridge"
description: >-
  Local TCP/MQTT bridge for the VISTA Turbo RS-232 automation interface.
  Developed and tested on VISTA-128BPT.
url: "https://github.com/wtc-brycel/vistaturbo-hass"
arch:
  - amd64
  - aarch64
startup: application
stage: experimental
init: false
services:
  - mqtt:need
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-home
panel_admin: true
options:
  # Panel
  panel_host: "192.0.2.10"
  panel_port: 10001
  panel_timezone: "America/New_York"
  keypad_partitions: "1"

  # Control
  control_enabled: false
  keypad_control_enabled: false
  native_alarm_control_enabled: false
  chime_zones: ""

  # Optional TransPort event printer
  transport_print_enabled: false
  transport_host: ""
  transport_http_port: 9101
  transport_print_width: 32

  # Diagnostics
  raw_logging: false
  debug_raw_tx_enabled: false
schema:
  # Panel
  panel_host: str
  panel_port: port
  panel_timezone: str
  keypad_partitions: str

  # Control
  control_enabled: bool
  keypad_control_enabled: bool
  native_alarm_control_enabled: bool
  chime_zones: str

  # Event history
  event_history_max_age_days: "int(1,3650)?"

  # Optional TransPort event printer
  transport_print_enabled: bool
  transport_host: str
  transport_http_port: port
  transport_print_width: int(24,64)

  # Diagnostics
  raw_logging: bool
  raw_mqtt_enabled: bool?
  debug_raw_tx_enabled: bool

  # Advanced MQTT namespace overrides. Optional so existing installations do
  # not gain newly required keys during an upgrade.
  mqtt_base_topic: str?
  mqtt_discovery_prefix: str?

  # MQTT security. Optional for the same upgrade-safety reason.
  mqtt_tls_enabled: bool?
  mqtt_tls_ca: str?
  mqtt_tls_client_cert: str?
  mqtt_tls_client_key: str?
