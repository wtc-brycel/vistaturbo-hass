configuration:
  panel_host:
    name: Panel · Serial server host
    description: IP address or DNS name of the TCP serial server.
  panel_port:
    name: Panel · TCP port
    description: TCP server port that transparently exposes the VISTA RS-232 connection.
  panel_timezone:
    name: Panel · Timezone
    description: IANA timezone used to interpret the VISTA panel's local event timestamps.
  keypad_partitions:
    name: Panel · Partitions
    description: Comma-separated VISTA partitions to expose through Home Assistant.
  control_enabled:
    name: Control · Enable panel control
    description: Master safety gate for all commands that change panel state.
  keypad_control_enabled:
    name: Control · Virtual keypad
    description: Allow the Home Assistant virtual keypad to send keypad commands.
  native_alarm_control_enabled:
    name: Control · Alarm entity
    description: Allow Home Assistant alarm-control-panel actions to send panel commands.
  chime_zones:
    name: Chime · Zones
    description: Comma-separated zone numbers that should produce chime events.
  event_history_startup_dump_enabled:
    name: History · Import panel log on startup
    description: Request the VISTA historical event log after startup synchronization.
  event_history_max_age_days:
    name: History · Retention
    description: Days to retain the local event journal and keypad audit; defaults to 90 when unset.
  transport_print_enabled:
    name: TransPort · Enable event printing
    description: Send valid unsolicited VISTA system events to the TransPort event printer.
  transport_host:
    name: TransPort · Host
    description: IP address or DNS name of the TransPort appliance running the event printer.
  transport_http_port:
    name: TransPort · HTTP port
    description: HTTP port for POST /print; TransPort defaults to 9101.
  transport_print_width:
    name: TransPort · Receipt columns
    description: Plain-text receipt width. 32 columns fits typical 58 mm printers.
  raw_logging:
    name: Diagnostics · Log raw frames
    description: Print each received VISTA frame in ASCII and hexadecimal form to the App log.
  raw_mqtt_enabled:
    name: Diagnostics · Publish raw MQTT frames
    description: Publish raw protocol frames to diagnostic MQTT topics; disabled when unset.
  debug_raw_tx_enabled:
    name: Diagnostics · Guarded raw transmit
    description: Dangerous diagnostic feature. Keep disabled unless testing panel commands.
  mqtt_base_topic:
    name: Advanced · MQTT base topic
    description: Override the default vista128 MQTT topic namespace.
  mqtt_discovery_prefix:
    name: Advanced · MQTT discovery prefix
    description: Override the Home Assistant MQTT discovery prefix; normally homeassistant.
  mqtt_tls_enabled:
    name: Security · MQTT TLS
    description: Verify the MQTT broker through TLS instead of using plaintext MQTT.
  mqtt_tls_ca:
    name: Security · MQTT CA certificate
    description: CA certificate path used to verify the MQTT broker when TLS is enabled.
  mqtt_tls_client_cert:
    name: Security · MQTT client certificate
    description: Optional client certificate path for mutual TLS; configure together with the client key.
  mqtt_tls_client_key:
    name: Security · MQTT client key
    description: Optional client key path for mutual TLS; configure together with the client certificate.
