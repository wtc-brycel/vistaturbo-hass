name: Apply editor focus fix

on:
  push:
    branches:
      - fix/editor-focus
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editor-focus
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply focus-stability patch
        run: python scripts/patch_editor_focus.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check frontend/vista-keypad-card.js
      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend regression suite
        working-directory: frontend
        run: npm run test:render
      - name: Commit validated card
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/vista-keypad-card.js
          git commit -m "Keep visual editor focus stable"
          git push origin HEAD:fix/editor-focus
