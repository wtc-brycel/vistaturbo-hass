name: Apply keypad typography patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'frontend/keypad-typography-fidelity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply focused typography changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/vista-keypad-card.js")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old!r}")
              text = text.replace(old, new, 1)

          replace_once(
              'const VISTA_KEYPAD_CARD_VERSION = "0.3.26";',
              'const VISTA_KEYPAD_CARD_VERSION = "0.3.27";',
          )

          replace_once(
              '        --led-flash-period:${flashPeriod}ms;',
              '        --led-flash-period:${flashPeriod}ms;\n'
              '        --vista-keypad-font:"Arial Narrow","Roboto Condensed","Liberation Sans Narrow","Nimbus Sans Narrow",Arial,sans-serif;',
          )

          font_decl = 'font-family:"Arial Narrow","Roboto Condensed",Arial,sans-serif;'
          font_matches = text.count(font_decl)
          if font_matches != 6:
              raise SystemExit(f"expected six keypad font declarations, found {font_matches}")
          text = text.replace(font_decl, 'font-family:var(--vista-keypad-font);')

          replace_once(
              '        font-size:clamp(5px,1.42cqw,16px);\n'
              '        line-height:1;\n'
              '        font-weight:800;',
              '        font-size:clamp(5px,1.42cqw,16px);\n'
              '        line-height:1;\n'
              '        font-weight:700;',
          )

          replace_once(
              '        line-height:.9;\n'
              '        transform:scaleX(.76);\n'
              '        transform-origin:center;',
              '        line-height:.9;\n'
              '        transform:none;',
          )

          replace_once(
              '        font-size:clamp(4px,1.22cqw,13px);\n'
              '        font-weight:700;\n'
              '        font-style:italic;',
              '        font-size:clamp(4px,1.22cqw,13px);\n'
              '        font-weight:600;\n'
              '        font-style:italic;',
          )

          replace_once(
              '        font-size:clamp(6px,1.72cqw,18px);\n'
              '        font-weight:700;\n'
              '        line-height:1;',
              '        font-size:clamp(6px,1.72cqw,18px);\n'
              '        font-weight:600;\n'
              '        line-height:1;',
          )

          replace_once(
              'font:800 10px/1 "Arial Narrow","Roboto Condensed",Arial,sans-serif;',
              'font:700 10px/1 var(--vista-keypad-font);',
          )

          replace_once(
              '    const dot = Math.min(charW / 6.45, lineH / 8.05);\n'
              '    const gap = dot * .19;\n'
              '    const px = dot - gap;',
              '    // The physical alpha display is a 5x7 matrix in a 6x8 character\n'
              '    // cell. Preserve that pitch and snap to device pixels so small\n'
              '    // compact cards keep visible separation between LCD elements.\n'
              '    const dot = Math.min(charW / 6, lineH / 8);\n'
              '    const gap = dot * .34;\n'
              '    const px = dot - gap;\n'
              '    const snap = (value) => Math.round(value * scale) / scale;\n'
              '    const pixelSize = Math.max(1 / scale, snap(px));',
          )

          replace_once(
              '                Math.round(baseX + gx * dot),\n'
              '                Math.round(baseY + gy * dot),\n'
              '                Math.max(1, Math.ceil(px)),\n'
              '                Math.max(1, Math.ceil(px))',
              '                snap(baseX + gx * dot),\n'
              '                snap(baseY + gy * dot),\n'
              '                pixelSize,\n'
              '                pixelSize',
          )

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/keypad-typography-patch.yml").unlink()
          PY

      - name: Check JavaScript syntax
        run: node --check frontend/vista-keypad-card.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend regression suite
        working-directory: frontend
        run: npm run test:render

      - name: Commit finalized patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/vista-keypad-card.js frontend/tests/typography.spec.mjs .github/workflows/keypad-typography-patch.yml
          git commit -m "feat: improve keypad typography fidelity"
          git push origin HEAD:${{ github.head_ref }}
