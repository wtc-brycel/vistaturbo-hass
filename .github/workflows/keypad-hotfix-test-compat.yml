name: Adjust keypad metadata regression compatibility

on:
  push:
    branches:
      - fix/immediate-keypad-input
    paths:
      - .github/workflows/keypad-hotfix-test-compat.yml

permissions:
  contents: write

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/immediate-keypad-input
          fetch-depth: 0
      - name: Keep legacy metadata assertion focused on legacy fields
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          p = Path("vista128_bridge/tests/test_control_mqtt.py")
          text = p.read_text()
          old = 'if key not in {"started_at", "request_id"}'
          new = 'if key not in {"started_at", "request_id", "audit_interaction_id"}'
          if text.count(old) != 1:
              raise SystemExit(f"expected one metadata assertion filter, found {text.count(old)}")
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/keypad-hotfix-test-compat.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Keep legacy keypad metadata assertion compatible'
          git push origin HEAD:fix/immediate-keypad-input
