name: Ingress review

on:
  pull_request:
    paths:
      - "vista128_bridge/**"
      - "frontend/**"
      - ".github/workflows/ingress-review.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Package exact review source
        run: git archive HEAD -o ingress-review-source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ingress-review-source
          path: ingress-review-source.tar
          retention-days: 3
