name: Apply keypad audio documentation

on:
  push:
    branches:
      - feature/keypad-audio-feedback
    paths:
      - .github/workflows/apply-audio-docs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keypad-audio-feedback
      - name: Apply documentation patch
        run: python3 .github/scripts/apply_audio_docs.py
      - name: Commit documentation
        run: |
          rm .github/workflows/apply-audio-docs.yml .github/scripts/apply_audio_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document keypad audio feedback and chime zones"
          git push origin HEAD:feature/keypad-audio-feedback
