name: Run simplified Lovelace mobile layout patch

on:
  push:
    branches:
      - feature/mobile-lovelace-layout
    paths:
      - .github/workflows/mobile-layout-run2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-lovelace-layout
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch and validate card
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('frontend/vista-keypad-card.js')
          s = p.read_text()

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing anchor: {label}')
              s = s.replace(old, new, 1)

          rep('const VISTA_KEYPAD_CARD_VERSION = "0.3.14";', 'const VISTA_KEYPAD_CARD_VERSION = "0.3.15";', 'version')
          rep('      case_color: "auto",\n      read_only: true,\n', '      case_color: "auto",\n      mobile_layout: "auto",\n      read_only: true,\n', 'stub')
          rep(
              '    const caseColor = String(config.case_color ?? "auto").toLowerCase();\n    if (caseColor !== "auto" && !CASE_COLORS.has(caseColor)) {\n      throw new Error("case_color must be auto, red, white, or dark");\n    }\n\n',
              '    const caseColor = String(config.case_color ?? "auto").toLowerCase();\n    if (caseColor !== "auto" && !CASE_COLORS.has(caseColor)) {\n      throw new Error("case_color must be auto, red, white, or dark");\n    }\n\n    const mobileLayout = String(config.mobile_layout ?? "auto").toLowerCase();\n    if (!["auto", "compact", "physical"].includes(mobileLayout)) {\n      throw new Error("mobile_layout must be auto, compact, or physical");\n    }\n\n',
              'validation',
          )
          rep(
              '      case_color: "auto",\n      day_case_color: null,\n      night_case_color: null,\n      read_only: true,\n',
              '      case_color: "auto",\n      day_case_color: null,\n      night_case_color: null,\n      mobile_layout: "auto",\n      read_only: true,\n',
              'default',
          )
          rep('      night_case_color: nightCaseColor,\n    };\n', '      night_case_color: nightCaseColor,\n      mobile_layout: mobileLayout,\n    };\n', 'normalized')
          rep('      columns: 12,\n      min_columns: 6,\n      max_columns: 12,\n', '      columns: 12,\n      min_columns: 8,\n      max_columns: 12,\n', 'grid')
          rep(
              '    const caseClass = `case-${resolvedCaseColor}`;\n\n    return `<div class="keypad-shell ${isCR2 ? "cr2" : "k6160"} ${caseClass}" data-model="${model}" data-case-color="${escapeHtml(resolvedCaseColor)}">\n',
              '    const caseClass = `case-${resolvedCaseColor}`;\n    const layoutClass = `layout-${this._config?.mobile_layout ?? "auto"}`;\n\n    return `<div class="keypad-shell ${isCR2 ? "cr2" : "k6160"} ${caseClass} ${layoutClass}" data-model="${model}" data-case-color="${escapeHtml(resolvedCaseColor)}">\n',
              'layout class',
          )

          compact_css = r'''
          /* Lovelace/mobile composition. */
          .keypad-shell.compact-layout {
            aspect-ratio:auto;
            min-height:0;
            height:auto;
            display:grid;
            grid-template-columns:minmax(0,1fr);
            grid-template-rows:auto auto auto;
            gap:8px;
            padding:10px 10px 12px;
            overflow:hidden;
          }

          .compact-layout .speaker,
          .compact-layout .burg-bracket,
          .compact-layout .fire-bracket,
          .compact-layout .burg-icon,
          .compact-layout .fire-icon {
            display:none;
          }

          .compact-layout .display-hood {
            position:relative;
            left:auto;
            right:auto;
            top:auto;
            width:100%;
            height:clamp(78px,23cqw,96px);
            border-radius:5px;
          }

          .compact-layout.k6160 .display-hood {
            left:auto;
            width:100%;
          }

          .compact-layout .lcd-frame {
            left:3.2%;
            right:3.2%;
            top:14%;
            height:72%;
            padding:3px;
            border-radius:2px;
          }

          .compact-layout .status-cr2,
          .compact-layout .status-6160 {
            position:relative;
            left:auto;
            top:auto;
            width:100%;
            height:auto;
          }

          .compact-layout .status-cr2 {
            display:grid;
            grid-template-columns:repeat(4,minmax(0,1fr));
            gap:6px;
          }

          .compact-layout .burg-panel,
          .compact-layout .fire-panel,
          .compact-layout .burg-rows,
          .compact-layout .fire-rows {
            display:contents;
          }

          .compact-layout .status-6160 {
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:6px;
          }

          .compact-layout .led-row,
          .compact-layout .burg-rows .led-row,
          .compact-layout .status-6160 .led-row {
            display:flex;
            flex-direction:row;
            align-items:center;
            justify-content:center;
            gap:4px;
            min-width:0;
            min-height:32px;
            padding:5px 3px;
            border:1px solid rgba(127,127,127,.28);
            border-radius:6px;
            font-size:clamp(6px,2.2cqw,10px);
            font-weight:700;
            line-height:1;
            background:rgba(0,0,0,.055);
          }

          .compact-layout.case-white .led-row {
            background:rgba(0,0,0,.035);
          }

          .compact-layout.case-dark .led-row {
            background:rgba(255,255,255,.045);
          }

          .compact-layout .led-label {
            min-width:0;
            white-space:nowrap;
            text-shadow:none;
          }

          .compact-layout .led {
            flex:0 0 auto;
            width:16px;
            height:8px;
            border-width:1px;
            outline-width:1px;
            outline-offset:1px;
          }

          .compact-layout .controls-well {
            position:relative;
            left:auto;
            top:auto;
            width:100%;
            height:auto;
          }

          .compact-layout .key-grid {
            width:100%;
            height:auto;
            display:grid;
            grid-template-columns:repeat(4,minmax(0,1fr));
            grid-template-rows:repeat(4,clamp(52px,14cqw,60px));
            column-gap:7px;
            row-gap:7px;
          }

          .compact-layout .grid-slot {
            width:auto;
            height:auto;
            min-width:0;
          }

          .compact-layout .function-slot {
            transform:none;
          }

          .compact-layout .physical-key {
            min-width:0;
            min-height:52px;
            padding:2px 3px;
            border-width:1px;
            border-radius:6px;
          }

          .compact-layout .function-label {
            font-size:clamp(8px,2.7cqw,11px);
          }

          .compact-layout .number-key {
            flex-direction:column;
            gap:0;
          }

          .compact-layout .number-main {
            font-size:clamp(21px,7cqw,29px);
            line-height:.92;
          }

          .compact-layout .number-legend {
            font-size:clamp(7px,2.25cqw,10px);
            line-height:1;
          }

          @container (max-width:320px) {
            .compact-layout .status-cr2 {
              grid-template-columns:repeat(3,minmax(0,1fr));
            }

            .compact-layout .led-row,
            .compact-layout .burg-rows .led-row,
            .compact-layout .status-6160 .led-row {
              font-size:6px;
            }

            .compact-layout .key-grid {
              column-gap:5px;
              row-gap:6px;
            }

            .compact-layout .physical-key {
              min-height:50px;
              padding:1px 2px;
            }
          }
          '''

          marker = '      @media(prefers-reduced-motion:reduce) {\n'
          if marker not in s:
              raise SystemExit('missing anchor: reduced motion css')
          s = s.replace(marker, compact_css + '\n' + marker, 1)

          rep(
              '  _observeResize() {\n',
              '  _updateResponsiveLayout() {\n    const shell = this.shadowRoot?.querySelector(".keypad-shell");\n    if (!shell) return;\n    const mode = this._config?.mobile_layout ?? "auto";\n    const width = shell.getBoundingClientRect().width;\n    const compact = mode === "compact" || (mode === "auto" && width <= 480);\n    shell.classList.toggle("compact-layout", compact);\n  }\n\n  _observeResize() {\n',
              'responsive method',
          )
          rep(
              '      this._resizeFrame = requestAnimationFrame(() => {\n        this._resizeFrame = 0;\n        this._drawLCD();\n      });\n',
              '      this._resizeFrame = requestAnimationFrame(() => {\n        this._resizeFrame = 0;\n        this._updateResponsiveLayout();\n        this._drawLCD();\n      });\n',
              'resize update',
          )
          rep(
              '    requestAnimationFrame(() => {\n      this._drawLCD();\n      this._observeResize();\n    });\n',
              '    requestAnimationFrame(() => {\n      this._updateResponsiveLayout();\n      this._drawLCD();\n      this._observeResize();\n    });\n',
              'initial update',
          )

          p.write_text(s)

          readme = Path('frontend/README.md')
          r = readme.read_text()
          anchor = '## Responsive sizing\n\n'
          if anchor not in r:
              raise SystemExit('missing README anchor')
          text = '## Responsive sizing\n\n`mobile_layout: auto` is the default. At card widths of 480 px or less, the card switches from the physical composition to a Lovelace-oriented compact composition. The LCD becomes full-width, decorative speaker/bracket/icon details are hidden, CR-2 annunciators become a compact status strip, and the 4 x 4 keys use the full card width with touch-sized rows.\n\nModes: `auto`, `compact`, and `physical`. The card advertises 12 columns by default with a minimum of 8 columns in Home Assistant Sections view.\n\n'
          readme.write_text(r.replace(anchor, text, 1))
          PY

          node --check frontend/vista-keypad-card.js
          grep -q 'VISTA_KEYPAD_CARD_VERSION = "0.3.15"' frontend/vista-keypad-card.js
          grep -q 'compact-layout' frontend/vista-keypad-card.js
          grep -q 'mobile_layout: "auto"' frontend/vista-keypad-card.js

      - name: Commit verified patch
        run: |
          rm -f .github/workflows/mobile-layout-patch.yml .github/workflows/mobile-layout-run.yml .github/workflows/mobile-layout-run2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Lovelace compact mobile keypad layout"
          git push origin HEAD:feature/mobile-lovelace-layout
