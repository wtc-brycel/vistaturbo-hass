name: Apply immediate keypad hotfix

on:
  push:
    branches:
      - fix/immediate-keypad-input
    paths:
      - .github/workflows/keypad-hotfix-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/immediate-keypad-input
          fetch-depth: 0
      - name: Apply exact keypad regression fix
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git apply --check .github/keypad-hotfix-card.patch
          git apply .github/keypad-hotfix-card.patch
          cp .github/keypad-hotfix-control.spec.mjs frontend/tests/control.spec.mjs
          python - <<'PY'
          from pathlib import Path
          p = Path("frontend/vista-keypad-simulator.html")
          text = p.read_text()
          old = "Vista Keypad 0.3.25 simulator"
          new = "Vista Keypad 0.3.26 simulator"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one simulator version marker, found {text.count(old)}")
          p.write_text(text.replace(old, new))
          PY
          node --check frontend/vista-keypad-card.js
          node --check frontend/tests/control.spec.mjs
          ! grep -Fq 'Press SEND to finish the command' frontend/vista-keypad-card.js
          ! grep -Fq 'id="keypad-complete"' frontend/vista-keypad-card.js
          ! grep -Fq '_pendingKeys' frontend/vista-keypad-card.js
          ! grep -Fq '_interactionId' frontend/vista-keypad-card.js
          ! grep -Fq 'KEYPAD_FRAME_MAX_KEYS' frontend/vista-keypad-card.js
          grep -Fq 'const VISTA_KEYPAD_CARD_VERSION = "0.3.26";' frontend/vista-keypad-card.js
          grep -Fq 'complete: true' frontend/vista-keypad-card.js
          rm .github/keypad-hotfix-card.patch
          rm .github/keypad-hotfix-control.spec.mjs
          rm .github/workflows/keypad-hotfix-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix keypad to transmit every press immediately'
          git push origin HEAD:fix/immediate-keypad-input
