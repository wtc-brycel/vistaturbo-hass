name: Capture LCD readability revision

on:
  push:
    branches:
      - frontend/keypad-typography-fidelity

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Capture screenshots
        working-directory: frontend
        run: |
          mkdir -p screenshots
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { readFileSync } from 'node:fs';

          const source = readFileSync('vista-keypad-card.js', 'utf8');
          const browser = await chromium.launch({ headless: true });

          async function capture(width, layout, file) {
            const page = await browser.newPage({ viewport: { width: Math.max(width + 80, 480), height: 900 }, deviceScaleFactor: 2 });
            await page.setContent(`<!doctype html><html><head><meta charset="utf-8"><style>
              html,body{margin:0;padding:20px;background:#181a1b}
              #stage{width:${width}px;margin:0 auto}
              vista-keypad-card{display:block;width:100%}
            </style></head><body><div id="stage"><vista-keypad-card id="card"></vista-keypad-card></div></body></html>`);
            await page.evaluate(() => {
              if (!customElements.get('ha-card')) customElements.define('ha-card', class extends HTMLElement {});
            });
            await page.addScriptTag({ content: source });
            await page.evaluate(({ layout }) => {
              const entity = 'sensor.vista_partition_1_keypad';
              const card = document.getElementById('card');
              card.setConfig({ entity, model:'6160cr2', layout, case_color:'dark', read_only:true });
              card.hass = {
                themes:{ darkMode:true },
                states:{
                  [entity]:{
                    state:'P1 DISARMED / READY TO ARM',
                    attributes:{
                      line_1:'P1    DISARMED   ',
                      line_2:'BYPAS-RDY TO ARM',
                      ready:true, armed:false, trouble:false, backlight:true,
                      power:false, fire_alarm:false, silenced:false, supervisory:false
                    }
                  }
                }
              };
            }, { layout });
            await page.evaluate(() => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))));
            await page.locator('#stage').screenshot({ path:file });
            await page.close();
          }

          await capture(700, 'physical', 'screenshots/cr2-physical-readable.png');
          await capture(390, 'compact', 'screenshots/cr2-compact-readable.png');
          await browser.close();
          NODE
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: lcd-readability-screenshots
          path: frontend/screenshots/*.png
          retention-days: 3
