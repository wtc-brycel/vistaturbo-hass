name: Harden keypad control

on:
  push:
    branches: [feature/keypad-control]
    paths: [.github/workflows/harden-keypad-control.yml]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keypad-control
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python .github/scripts/harden_keypad_control.py
      - working-directory: vista128_bridge
        run: python -m unittest discover -s tests -v
      - run: node --check frontend/vista-keypad-card.js
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:render
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vista128_bridge
          git commit -m "Harden keypad control replay and code-entry behavior"
          git push origin HEAD:feature/keypad-control
