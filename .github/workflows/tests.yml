name: Tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vista128_bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check ../frontend/vista-keypad-card.js

  frontend-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run keypad browser regression tests
        working-directory: frontend
        run: npm run test:render

  rc8-apply:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/rc8-control-state-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rc8-control-state-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply RC8 hardening patch
        run: |
          python .github/scripts/apply_rc8_hardening.py
          python .github/scripts/fix_rc8_hardening.py
      - name: Run backend tests
        working-directory: vista128_bridge
        run: python -m unittest discover -s tests -v
      - name: Validate frontend syntax
        run: node --check frontend/vista-keypad-card.js
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        working-directory: frontend
        run: npm run test:render
      - name: Commit validated RC8 hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/vista-keypad-card.js frontend/tests/control.spec.mjs vista128_bridge/app/vista_bridge/control.py vista128_bridge/app/vista_bridge/bridge.py vista128_bridge/app/vista_bridge/message_handler.py vista128_bridge/app/vista_bridge/mqtt_discovery.py vista128_bridge/app/vista_bridge/mqtt_client.py vista128_bridge/app/vista_bridge/state.py vista128_bridge/tests/test_control.py vista128_bridge/tests/test_state.py vista128_bridge/tests/test_mqtt_client.py
          git commit -m "Harden automation availability and semantic trouble state"
          git push origin HEAD:feature/rc8-control-state-hardening
