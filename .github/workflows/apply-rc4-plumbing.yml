name: Apply RC4 integration plumbing

on:
  push:
    branches:
      - feature/keypad-audio-feedback
    paths:
      - .github/workflows/apply-rc4-plumbing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keypad-audio-feedback
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply integration patch
        run: python .github/scripts/apply_rc4_plumbing.py
      - name: Run backend tests
        working-directory: vista128_bridge
        run: python -m unittest discover -s tests -v
      - name: Validate frontend syntax
        run: node --check frontend/vista-keypad-card.js
      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend browser regression tests
        working-directory: frontend
        run: npm run test:render
      - name: Commit verified integration
        run: |
          rm .github/workflows/apply-rc4-plumbing.yml .github/scripts/apply_rc4_plumbing.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden audible state and package simulator"
          git push origin HEAD:feature/keypad-audio-feedback
