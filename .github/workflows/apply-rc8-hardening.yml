name: Apply RC8 hardening

on:
  push:
    branches:
      - feature/rc8-control-state-hardening
    paths:
      - .github/workflows/apply-rc8-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rc8-control-state-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply hardening patch
        run: python .github/scripts/apply_rc8_hardening.py
      - name: Run backend tests
        working-directory: vista128_bridge
        run: python -m unittest discover -s tests -v
      - name: Validate frontend syntax
        run: node --check frontend/vista-keypad-card.js
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        working-directory: frontend
        run: npm run test:render
      - name: Commit validated hardening changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/vista-keypad-card.js frontend/tests/control.spec.mjs vista128_bridge/app/vista_bridge/control.py vista128_bridge/app/vista_bridge/bridge.py vista128_bridge/app/vista_bridge/message_handler.py vista128_bridge/app/vista_bridge/mqtt_discovery.py vista128_bridge/app/vista_bridge/mqtt_client.py vista128_bridge/app/vista_bridge/state.py vista128_bridge/tests/test_control.py vista128_bridge/tests/test_state.py vista128_bridge/tests/test_mqtt_client.py
          git commit -m "Harden automation availability and semantic trouble state"
          git push origin HEAD:feature/rc8-control-state-hardening
