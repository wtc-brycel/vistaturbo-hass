name: Apply event log frontend

on:
  push:
    branches:
      - feature/event-history
    paths:
      - .github/workflows/apply-event-log-frontend.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/event-history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply event journal frontend
        run: python .github/scripts/apply_event_log_frontend.py
      - name: Validate frontend syntax
        run: node --check frontend/vista-keypad-card.js
      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        working-directory: frontend
        run: npm test
      - name: Run backend regression tests
        working-directory: vista128_bridge
        run: python -m unittest discover -s tests -v
      - name: Commit verified frontend integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/vista-keypad-card.js frontend/README.md
          git commit -m "Add Home Assistant VISTA event journal card"
          git push origin HEAD:feature/event-history
