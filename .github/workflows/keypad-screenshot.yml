name: Capture keypad typography screenshots

on:
  push:
    branches:
      - frontend/keypad-typography-fidelity

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Capture screenshots
        working-directory: frontend
        run: |
          mkdir -p screenshots
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import { readFileSync } from 'node:fs';

          const cardSource = readFileSync('vista-keypad-card.js', 'utf8');
          const browser = await chromium.launch({ headless: true });

          async function capture(name, width, layout) {
            const page = await browser.newPage({ viewport: { width: width + 80, height: 920 }, deviceScaleFactor: 2 });
            await page.setContent(`<!doctype html><html><head><meta charset="utf-8"><style>
              html,body{margin:0;padding:0;background:#202124;color:#eee;font-family:Arial,sans-serif}
              body{padding:32px 40px}
              #stage{width:${width}px;margin:0 auto}
              vista-keypad-card{display:block;width:100%}
            </style></head><body><div id="stage"><vista-keypad-card id="card"></vista-keypad-card></div></body></html>`);
            await page.evaluate(() => {
              if (!customElements.get('ha-card')) customElements.define('ha-card', class extends HTMLElement {});
            });
            await page.addScriptTag({ content: cardSource });
            await page.evaluate(({ layout }) => {
              const entity = 'sensor.vista_partition_1_keypad';
              const card = document.getElementById('card');
              card.setConfig({
                entity,
                model: '6160cr2',
                layout,
                case_color: 'red',
                read_only: true,
                show_card_background: false,
              });
              card.hass = {
                themes: { darkMode: false },
                states: {
                  [entity]: {
                    state: 'DISARMED READY TO ARM',
                    attributes: {
                      line_1: 'DISARMED        ',
                      line_2: 'READY TO ARM    ',
                      ready: true,
                      armed: false,
                      trouble: false,
                      backlight: true,
                      power: true,
                      fire_alarm: false,
                      silenced: false,
                      supervisory: false,
                      burglary_alarm: false,
                      auxiliary_alarm: false,
                      sound_mode: 'none',
                      control_enabled: false,
                      command_topic: '',
                    },
                  },
                },
              };
            }, { layout });
            await page.evaluate(() => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve))));
            await page.locator('#stage').screenshot({ path: `screenshots/${name}.png` });
            await page.close();
          }

          await capture('cr2-physical', 860, 'physical');
          await capture('cr2-compact', 390, 'compact');
          await browser.close();
          NODE
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: keypad-typography-screenshots
          path: frontend/screenshots/*.png
          if-no-files-found: error
          retention-days: 3
