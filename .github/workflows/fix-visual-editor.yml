name: Fix visual editor shorthand

on:
  push:
    branches:
      - feature/visual-editor
    paths:
      - .github/workflows/fix-visual-editor.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visual-editor
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply compatibility fix
        run: python .github/scripts/fix_visual_editor_shorthand.py
      - name: Validate frontend syntax
        run: node --check frontend/vista-keypad-card.js
      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        working-directory: frontend
        run: npm run test:render
      - name: Commit verified compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/vista-keypad-card.js frontend/tests/render.spec.mjs
          git commit -m "Handle visual editor shorthand config"
          git push origin HEAD:feature/visual-editor
