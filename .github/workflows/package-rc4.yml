name: Package RC4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/package-rc4.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply RC4 package metadata and docs
        run: python .github/scripts/package_rc4.py
      - name: Verify release metadata is still RC3
        run: |
          test "$(jq -r .tag release/rc.json)" = "v0.2.6-rc.3"
      - name: Run backend tests
        working-directory: vista128_bridge
        run: python -m unittest discover -s tests -v
      - name: Commit packaged RC4 tree
        run: |
          rm .github/workflows/package-rc4.yml .github/scripts/package_rc4.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Package Vista Turbo RS232 0.2.6 RC4"
          git push origin HEAD:main
