name: Apply keypad v0.3.13 patch

on:
  push:
    branches:
      - feature/cr2-annunciators-theme
    paths:
      - .github/workflows/apply-v013.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cr2-annunciators-theme
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply frontend patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/vista-keypad-card.js')
          s=p.read_text()
          def rep(old,new,count=1):
              global s
              if old not in s:
                  raise SystemExit(f'expected text not found: {old[:100]!r}')
              s=s.replace(old,new,count)
          rep('const VISTA_KEYPAD_CARD_VERSION = "0.3.12";', 'const VISTA_KEYPAD_CARD_VERSION = "0.3.13";')
          aliases='''const MODEL_ALIASES = {\n  "6160cr2": "6160cr2",\n  "6160cr-2": "6160cr2",\n  "cr2": "6160cr2",\n  "6160": "6160",\n};\n'''
          rep(aliases, aliases+'''\nconst CASE_COLORS = new Set(["red", "white", "dark"]);\nconst AUTO_CASE_DEFAULTS = {\n  "6160cr2": { day: "red", night: "dark" },\n  "6160": { day: "white", night: "dark" },\n};\n''')
          rep('''      model: "6160cr2",\n      read_only: true,''','''      model: "6160cr2",\n      case_color: "auto",\n      read_only: true,''')
          rep('''    const defaultCaseColor = model === "6160cr2" ? "auto" : "white";\n    const caseColor = String(config.case_color ?? defaultCaseColor).toLowerCase();\n    if (!["auto", "red", "white", "dark"].includes(caseColor)) {\n      throw new Error("case_color must be auto, red, white, or dark");\n    }\n\n    this._config = {\n      title: "",\n      model,\n      case_color: defaultCaseColor,\n      read_only: true,\n      show_card_background: false,\n      function_keys: {},\n      indicators: {},\n      indicator_flashing: {},\n      led_flash_period_ms: 1000,\n      sound: { enabled: false },\n      ...config,\n      model,\n      case_color: caseColor,\n    };''','''    const caseColor = String(config.case_color ?? "auto").toLowerCase();\n    if (caseColor !== "auto" && !CASE_COLORS.has(caseColor)) {\n      throw new Error("case_color must be auto, red, white, or dark");\n    }\n\n    const normalizeOptionalCaseColor = (value, name) => {\n      if (value === undefined || value === null || value === "") return null;\n      const normalized = String(value).toLowerCase();\n      if (!CASE_COLORS.has(normalized)) {\n        throw new Error(`${name} must be red, white, or dark`);\n      }\n      return normalized;\n    };\n\n    const dayCaseColor = normalizeOptionalCaseColor(config.day_case_color, "day_case_color");\n    const nightCaseColor = normalizeOptionalCaseColor(config.night_case_color, "night_case_color");\n\n    this._config = {\n      title: "",\n      model,\n      case_color: "auto",\n      day_case_color: null,\n      night_case_color: null,\n      read_only: true,\n      show_card_background: false,\n      function_keys: {},\n      indicators: {},\n      indicator_flashing: {},\n      led_flash_period_ms: 1000,\n      sound: { enabled: false },\n      ...config,\n      model,\n      case_color: caseColor,\n      day_case_color: dayCaseColor,\n      night_case_color: nightCaseColor,\n    };''')
          rep('''  _resolvedCaseColor(model) {\n    const configured = this._config?.case_color ?? (model === "6160cr2" ? "auto" : "white");\n    if (configured !== "auto") return configured;\n\n    const hassDarkMode = this._hass?.themes?.darkMode;\n    const systemDarkMode = typeof window !== "undefined" && window.matchMedia\n      ? window.matchMedia("(prefers-color-scheme: dark)").matches\n      : false;\n    const darkMode = typeof hassDarkMode === "boolean" ? hassDarkMode : systemDarkMode;\n    return darkMode ? "dark" : (model === "6160cr2" ? "red" : "white");\n  }''','''  _resolvedCaseColor(model) {\n    const configured = this._config?.case_color ?? "auto";\n    if (configured !== "auto") return configured;\n\n    const defaults = AUTO_CASE_DEFAULTS[model] ?? AUTO_CASE_DEFAULTS["6160cr2"];\n    const dayColor = this._config?.day_case_color ?? defaults.day;\n    const nightColor = this._config?.night_case_color ?? defaults.night;\n\n    const hassDarkMode = this._hass?.themes?.darkMode;\n    const systemDarkMode = typeof window !== "undefined" && window.matchMedia\n      ? window.matchMedia("(prefers-color-scheme: dark)").matches\n      : false;\n    const darkMode = typeof hassDarkMode === "boolean" ? hassDarkMode : systemDarkMode;\n    return darkMode ? nightColor : dayColor;\n  }''')
          rep('''        aspect-ratio:1.405/1;\n        min-height:410px;\n        overflow:hidden;''','''        aspect-ratio:1.405/1;\n        min-width:0;\n        overflow:hidden;''')
          s=s.replace('font-size:clamp(8px,1.42cqw,16px);','font-size:clamp(5px,1.42cqw,16px);')
          s=s.replace('font-size:clamp(19px,3.05cqw,34px);','font-size:clamp(9px,3.05cqw,34px);')
          s=s.replace('font-size:clamp(7px,1.22cqw,13px);','font-size:clamp(4px,1.22cqw,13px);')
          s=s.replace('font-size:clamp(9px,1.72cqw,18px);','font-size:clamp(6px,1.72cqw,18px);')
          s=s.replace('font-size:clamp(9px,1.48cqw,16px);','font-size:clamp(6px,1.48cqw,16px);')
          s=s.replace('font-size:clamp(8px,1.35cqw,15px);','font-size:clamp(5px,1.35cqw,15px);')
          status='''      .status-6160 {\n        position:absolute;\n        left:6.5%;\n        top:59.1%;\n        width:23.2%;\n        color:#171717;\n        font-family:"Arial Narrow","Roboto Condensed",Arial,sans-serif;\n      }\n'''
          rep(status,status+'''\n      .k6160.case-red .status-6160,\n      .k6160.case-dark .status-6160 {\n        color:#f0f1ef;\n      }\n\n      .k6160.case-white .status-6160 {\n        color:#171717;\n      }\n''')
          rep('''      @media(max-width:650px) {\n        .keypad-shell { min-height:300px; }\n        .wrap { gap:4px; }\n      }''','''      @media(max-width:650px) {\n        .wrap { gap:4px; }\n      }''')
          rep('''      @media(prefers-reduced-motion:reduce) {\n''','''      @container (max-width:520px) {\n        .physical-key { padding:0 .28cqw; }\n        .number-key { gap:.26cqw; }\n        .function-slot { transform:translateX(-1.0cqw); }\n      }\n\n      @container (max-width:360px) {\n        .physical-key { padding:0 .12cqw; }\n        .number-key { gap:.12cqw; }\n        .function-slot { transform:translateX(-.72cqw); }\n      }\n\n      @media(prefers-reduced-motion:reduce) {\n''')
          p.write_text(s)
          PY
          node --check frontend/vista-keypad-card.js
      - name: Commit patched component and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-v013.yml
          git add frontend/vista-keypad-card.js .github/workflows/apply-v013.yml
          git commit -m "Add configurable keypad day/night cases and responsive geometry"
          git push origin HEAD:feature/cr2-annunciators-theme
