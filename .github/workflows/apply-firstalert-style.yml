name: Apply First Alert style

on:
  push:
    branches:
      - feature/keypad-audio-feedback
    paths:
      - .github/workflows/apply-firstalert-style.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keypad-audio-feedback
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply patch
        run: python .github/scripts/apply_firstalert_style.py
      - name: Validate frontend syntax
        run: node --check frontend/vista-keypad-card.js
      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend browser regression tests
        working-directory: frontend
        run: npm run test:render
      - name: Commit verified patch
        run: |
          rm .github/workflows/apply-firstalert-style.yml .github/scripts/apply_firstalert_style.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add First Alert adaptive keypad style"
          git push origin HEAD:feature/keypad-audio-feedback
