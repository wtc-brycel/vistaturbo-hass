name: Polish event history

on:
  push:
    branches:
      - feature/event-history
    paths:
      - .github/workflows/polish-event-history.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/event-history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply production polish
        run: python .github/scripts/polish_event_history.py
      - name: Run backend tests
        working-directory: vista128_bridge
        run: python -m unittest discover -s tests -v
      - name: Validate frontend syntax
        run: node --check frontend/vista-keypad-card.js
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        working-directory: frontend
        run: npm run test:render
      - name: Commit verified polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md frontend/vista-keypad-card.js vista128_bridge
          git commit -m "Polish event journal availability and documentation"
          git push origin HEAD:feature/event-history
