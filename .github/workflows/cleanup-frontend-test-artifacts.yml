name: Clean frontend test artifacts

on:
  push:
    branches:
      - feature/keypad-audio-feedback
    paths:
      - .github/workflows/cleanup-frontend-test-artifacts.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keypad-audio-feedback
      - name: Remove generated frontend dependencies and protect tree
        run: |
          git rm -r frontend/node_modules
          cat >> .gitignore <<'EOF'
          frontend/node_modules/
          frontend/test-results/
          frontend/playwright-report/
          EOF
          rm .github/workflows/cleanup-frontend-test-artifacts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ignore frontend test artifacts"
          git push origin HEAD:feature/keypad-audio-feedback
