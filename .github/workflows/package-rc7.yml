name: Package RC7

on:
  push:
    branches: [main]
    paths: [.github/workflows/package-rc7.yml]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python .github/scripts/package_rc7.py
      - run: grep -q '"tag": "v0.2.6-rc.6"' release/rc.json
      - working-directory: vista128_bridge
        run: python -m unittest discover -s tests -v
      - run: node --check frontend/vista-keypad-card.js
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:render
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md frontend vista128_bridge release/0.2.6-rc.7.md
          git commit -m "Package Vista Turbo RS232 0.2.6 RC7"
          git push origin HEAD:main
