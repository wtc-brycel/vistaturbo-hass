name: Fix keypad audio baseline

on:
  push:
    branches:
      - feature/keypad-audio-feedback
    paths:
      - .github/workflows/fix-audio-baseline.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keypad-audio-feedback
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply fix
        run: python3 .github/scripts/fix_audio_baseline.py
      - name: Validate JavaScript
        run: node --check frontend/vista-keypad-card.js
      - name: Commit verified fix
        run: |
          rm .github/workflows/fix-audio-baseline.yml .github/scripts/fix_audio_baseline.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prevent stale chime replay on card startup"
          git push origin HEAD:feature/keypad-audio-feedback
