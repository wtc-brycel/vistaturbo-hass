name: Apply centralized chime zone policy

on:
  push:
    branches: [feature/keypad-audio-feedback]
    paths: [.github/workflows/apply-chime-policy.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keypad-audio-feedback
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply chime policy plumbing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"missing anchor: {label}")
              p.write_text(s.replace(old, new, 1))

          # config.py: centralized zone-number list/range parser.
          p = Path("vista128_bridge/app/vista_bridge/config.py")
          s = p.read_text()
          anchor = '''def _partition_list(value: str) -> tuple[int, ...]:
    partitions = tuple(
        sorted({int(item.strip()) for item in value.split(",") if item.strip()})
    )
    if not partitions or any(partition < 1 or partition > 8 for partition in partitions):
        raise ValueError("keypad_partitions must contain partition numbers 1..8")
    return partitions
'''
          replacement = anchor + '''\n\ndef _zone_list(value: str) -> tuple[int, ...]:
    zones: set[int] = set()
    for item in value.split(","):
        token = item.strip()
        if not token:
            continue
        if "-" in token:
            start_text, end_text = token.split("-", 1)
            start = int(start_text.strip())
            end = int(end_text.strip())
            if end < start:
                raise ValueError("chime_zones ranges must be ascending")
            zones.update(range(start, end + 1))
        else:
            zones.add(int(token))
    if any(zone < 1 or zone > 128 for zone in zones):
        raise ValueError("chime_zones must contain zone numbers 1..128")
    return tuple(sorted(zones))
'''
          if anchor not in s:
              raise SystemExit("missing anchor: zone list parser")
          s = s.replace(anchor, replacement, 1)
          s = s.replace(
              '''class KeypadSettings:\n    enabled: bool\n    partitions: tuple[int, ...]\n    poll_interval_seconds: int\n    event_refresh_delay_ms: int\n''',
              '''class KeypadSettings:\n    enabled: bool\n    partitions: tuple[int, ...]\n    poll_interval_seconds: int\n    event_refresh_delay_ms: int\n    chime_zones: tuple[int, ...]\n''',
              1,
          )
          s = s.replace(
              '''                event_refresh_delay_ms=int(\n                    os.environ.get("KEYPAD_EVENT_REFRESH_DELAY_MS", "250")\n                ),\n            ),''',
              '''                event_refresh_delay_ms=int(\n                    os.environ.get("KEYPAD_EVENT_REFRESH_DELAY_MS", "250")\n                ),\n                chime_zones=_zone_list(os.environ.get("CHIME_ZONES", "")),\n            ),''',
              1,
          )
          p.write_text(s)

          # Home Assistant App config + environment bridge.
          replace_once(
              "vista128_bridge/config.yaml",
              '  keypad_event_refresh_delay_ms: 250\n',
              '  keypad_event_refresh_delay_ms: 250\n  chime_zones: ""\n',
              "app chime option",
          )
          replace_once(
              "vista128_bridge/config.yaml",
              '  keypad_event_refresh_delay_ms: int(0,5000)\n',
              '  keypad_event_refresh_delay_ms: int(0,5000)\n  chime_zones: str\n',
              "app chime schema",
          )
          replace_once(
              "vista128_bridge/run.sh",
              '''export KEYPAD_EVENT_REFRESH_DELAY_MS="$(config_or_default 'keypad_event_refresh_delay_ms' '250')"\n''',
              '''export KEYPAD_EVENT_REFRESH_DELAY_MS="$(config_or_default 'keypad_event_refresh_delay_ms' '250')"\nexport CHIME_ZONES="$(config_or_default 'chime_zones' '')"\n''',
              "chime env",
          )

          # Keypad state carries an event sequence instead of asking every card to watch zone entities.
          p = Path("vista128_bridge/app/vista_bridge/state.py")
          s = p.read_text()
          s = s.replace(
              '''    supervisory_led: bool | None = None\n    led_status: int = 0\n''',
              '''    supervisory_led: bool | None = None\n    chime_sequence: int = 0\n    chime_zone: int | None = None\n    chime_descriptor: str = ""\n    chime_at: str = ""\n    led_status: int = 0\n''',
              1,
          )
          s = s.replace(
              '''            "supervisory": self.supervisory_led,\n            "backlight": self.backlight,\n''',
              '''            "supervisory": self.supervisory_led,\n            "chime_sequence": self.chime_sequence,\n            "chime_zone": self.chime_zone,\n            "chime_descriptor": self.chime_descriptor,\n            "chime_at": self.chime_at,\n            "backlight": self.backlight,\n''',
              1,
          )
          anchor = '''    def assigned_zones_with(self, attribute: str) -> list[ZoneState]:\n'''
          method = '''    def record_chime(self, partition: int, zone_number: int, received_at: str) -> KeypadState | None:\n        zone = self.zones.get(zone_number)\n        resolved_partition = partition if partition in self.keypads else 0\n        if not resolved_partition and zone is not None:\n            resolved_partition = zone.partition\n        keypad = self.keypads.get(resolved_partition)\n        if keypad is None:\n            return None\n        keypad.chime_sequence += 1\n        keypad.chime_zone = zone_number\n        keypad.chime_descriptor = zone.descriptor if zone is not None else ""\n        keypad.chime_at = received_at\n        return keypad\n\n'''
          if anchor not in s:
              raise SystemExit("missing anchor: record chime")
          s = s.replace(anchor, method + anchor, 1)
          p.write_text(s)

          # F5 is the validated real-time fault transition. Only configured zones generate chimes.
          p = Path("vista128_bridge/app/vista_bridge/message_handler.py")
          s = p.read_text()
          anchor = '''        self._handle_system_event_side_effects(event.code)\n        self.synchronizer.request_keypad_refresh(event.partition)\n\n        # Supplemental 6160CR-2 annunciators are reconstructed from nq events.\n'''
          replacement = '''        self._handle_system_event_side_effects(event.code)\n        self.synchronizer.request_keypad_refresh(event.partition)\n\n        if event.code == "F5" and event.zone in self.settings.keypad.chime_zones:\n            keypad = self.state.record_chime(event.partition, event.zone, received_at)\n            if keypad is not None:\n                LOG.info(\n                    "Chime zone fault: zone=%03d partition=%d sequence=%d",\n                    event.zone,\n                    keypad.partition,\n                    keypad.chime_sequence,\n                )\n\n        # Supplemental 6160CR-2 annunciators and configured chime events are\n        # published immediately without waiting for the next KD poll.\n'''
          if anchor not in s:
              raise SystemExit("missing anchor: message chime")
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)

          # Test settings support explicit chime lists.
          p = Path("vista128_bridge/tests/helpers.py")
          s = p.read_text()
          s = s.replace(
              '''    printer_port: int = 9101,\n) -> Settings:\n''',
              '''    printer_port: int = 9101,\n    chime_zones: tuple[int, ...] = (),\n) -> Settings:\n''',
              1,
          )
          s = s.replace(
              '''            event_refresh_delay_ms=250,\n        ),\n''',
              '''            event_refresh_delay_ms=250,\n            chime_zones=chime_zones,\n        ),\n''',
              1,
          )
          p.write_text(s)

          # Focused regression tests for range parsing and listed/unlisted F5 events.
          p = Path("vista128_bridge/tests/test_message_handler.py")
          s = p.read_text()
          marker = '''    def test_captured_bypass_event_refreshes_zone_summaries(self):\n'''
          tests = '''    def test_configured_fault_zone_increments_keypad_chime_sequence(self):\n        handler = ProtocolMessageHandler(\n            make_settings(chime_zones=(27,)),\n            self.state,\n            self.mqtt,\n            self.printer,\n            self.sync,\n        )\n        self.sync.keypad_partition = 1\n        handler.handle(\n            "keypad_display",\n            b"29kd\\xd01   DISARMED   BYPAS-RDY TO ARM100CD",\n            "2026-08-16T13:22:28-04:00",\n        )\n        self.state.zones[27].partition = 1\n        self.state.zones[27].descriptor = "GLASS BREAK KITCHEN"\n        before = len(self.mqtt.keypad_states)\n        handler.handle(\n            "system_event",\n            b"1BnqF502700012123150826007B",\n            "2026-08-16T13:23:00-04:00",\n        )\n        keypad = self.state.keypads[1]\n        self.assertEqual(keypad.chime_sequence, 1)\n        self.assertEqual(keypad.chime_zone, 27)\n        self.assertEqual(keypad.chime_descriptor, "GLASS BREAK KITCHEN")\n        self.assertGreater(len(self.mqtt.keypad_states), before)\n\n    def test_unlisted_fault_zone_does_not_chime(self):\n        handler = ProtocolMessageHandler(\n            make_settings(chime_zones=(28,)),\n            self.state,\n            self.mqtt,\n            self.printer,\n            self.sync,\n        )\n        handler.handle(\n            "system_event",\n            b"1BnqF502700012123150826007B",\n            "2026-08-16T13:23:00-04:00",\n        )\n        self.assertEqual(self.state.keypads[1].chime_sequence, 0)\n\n'''
          if marker not in s:
              raise SystemExit("missing anchor: chime tests")
          s = s.replace(marker, tests + marker, 1)
          p.write_text(s)

          p = Path("vista128_bridge/tests/test_chime_config.py")
          p.write_text('''import os\nimport sys\nimport unittest\n\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), "..", "app"))\n\nfrom vista_bridge.config import _zone_list\n\n\nclass ChimeZoneConfigTests(unittest.TestCase):\n    def test_empty_list(self):\n        self.assertEqual(_zone_list(""), ())\n\n    def test_numbers_and_ranges(self):\n        self.assertEqual(_zone_list("1, 2, 5-8,27"), (1, 2, 5, 6, 7, 8, 27))\n\n    def test_invalid_zone_rejected(self):\n        with self.assertRaises(ValueError):\n            _zone_list("1,129")\n\n    def test_descending_range_rejected(self):\n        with self.assertRaises(ValueError):\n            _zone_list("8-5")\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')
          PY

          cd vista128_bridge
          python -m unittest discover -s tests -v
      - name: Commit verified chime plumbing
        run: |
          rm .github/workflows/apply-chime-policy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add centralized configurable chime zones"
          git push origin HEAD:feature/keypad-audio-feedback
