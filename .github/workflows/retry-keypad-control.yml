name: Retry keypad control

on:
  push:
    branches: [feature/keypad-control]
    paths: [.github/workflows/retry-keypad-control.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keypad-control
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python .github/scripts/apply_keypad_control.py
      - run: python .github/scripts/fix_keypad_control_topic.py
      - working-directory: vista128_bridge
        run: python -m unittest discover -s tests -v
      - run: node --check frontend/vista-keypad-card.js
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:render
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vista128_bridge frontend
          git commit -m "Add gated keypad and native alarm control"
          git push origin HEAD:feature/keypad-control
