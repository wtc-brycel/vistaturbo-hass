name: Apply keypad audio feedback

on:
  push:
    branches:
      - feature/keypad-audio-feedback
    paths:
      - .github/workflows/apply-audio-feedback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keypad-audio-feedback
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply patch
        run: python3 .github/scripts/apply_audio_feedback.py
      - name: Validate frontend
        run: node --check frontend/vista-keypad-card.js
      - name: Commit verified patch
        run: |
          rm .github/workflows/apply-audio-feedback.yml .github/scripts/apply_audio_feedback.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add optional keypad audio and haptic feedback"
          git push origin HEAD:feature/keypad-audio-feedback
