name: Apply LCD readability feedback

on:
  push:
    branches:
      - frontend/keypad-typography-fidelity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: frontend/keypad-typography-fidelity
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Apply LCD readability changes
        run: |
          python - <<'PY'
          from pathlib import Path

          card = Path('frontend/vista-keypad-card.js')
          text = card.read_text(encoding='utf-8')

          replacements = {
              'const VISTA_KEYPAD_CARD_VERSION = "0.3.27";': 'const VISTA_KEYPAD_CARD_VERSION = "0.3.28";',
              'background:#95d641;': 'background:#82bd37;',
              'bg.addColorStop(0, "#b2ed54");\n      bg.addColorStop(.5, "#9ee247");\n      bg.addColorStop(1, "#88cb38");': 'bg.addColorStop(0, "#96ce40");\n      bg.addColorStop(.5, "#85be37");\n      bg.addColorStop(1, "#73aa30");',
              'const gap = dot * .34;': 'const gap = dot * .18;',
              ': (lit ? "#17341a" : "#253126");': ': (lit ? "#102512" : "#253126");',
              'glare.addColorStop(0, "rgba(255,255,255,.10)");': 'glare.addColorStop(0, "rgba(255,255,255,.055)");',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          card.write_text(text, encoding='utf-8')

          test = Path('frontend/tests/typography.spec.mjs')
          t = test.read_text(encoding='utf-8')
          old = 'expect(cardSource).toContain("const gap = dot * .34;");'
          new = 'expect(cardSource).toContain("const gap = dot * .18;");\n  expect(cardSource).toContain(\'bg.addColorStop(.5, "#85be37");\');\n  expect(cardSource).toContain(\': (lit ? "#102512" : "#253126");\');'
          if t.count(old) != 1:
              raise SystemExit('LCD gap test expectation not found exactly once')
          test.write_text(t.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/lcd-readability-patch.yml').unlink()
          PY

      - name: Check JavaScript syntax
        run: node --check frontend/vista-keypad-card.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend regression suite
        working-directory: frontend
        run: npm run test:render

      - name: Commit feedback pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/vista-keypad-card.js frontend/tests/typography.spec.mjs .github/workflows/lcd-readability-patch.yml
          git commit -m "fix: improve LCD contrast and readability"
          git push origin HEAD:frontend/keypad-typography-fidelity
