<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Vista Keypad Card v0.3.1</title>
<style>
  :root{--primary-text-color:#111;--secondary-text-color:#667;--ha-card-background:#fff;--card-background-color:#fff}
  *{box-sizing:border-box}
  body{margin:0;padding:30px 36px 44px;background:#e8ebed;font-family:Arial,Helvetica,sans-serif;color:#171717}
  h1{margin:0 0 4px;font-size:24px} p{margin:0 0 26px;color:#687078}
  .stack{display:grid;gap:32px;max-width:1050px;margin:auto}
  .panel{background:white;border-radius:18px;padding:22px 26px 28px;box-shadow:0 10px 28px rgba(0,0,0,.11)}
  .panel h2{margin:0 0 16px;font-size:18px;font-weight:600;color:#34383c}
</style>
<script src="./vista-keypad-card.js"></script>
</head>
<body>
<div class="stack">
  <div><h1>Vista Turbo HASS physical keypad skins</h1><p>CSS, SVG and canvas render from the actual card code. No product photo or manufacturer branding is used.</p></div>
  <section class="panel"><h2>6160CR-2</h2><vista-keypad-card id="cr2"></vista-keypad-card></section>
  <section class="panel"><h2>6160</h2><vista-keypad-card id="k6160"></vista-keypad-card></section>
</div>
<script>
  const hass={states:{
    "sensor.vista_partition_1_keypad":{state:"Disarmed",attributes:{line_1:"*****DISARMED****",line_2:"READY TO ARM    ",ready:true,armed:false,trouble:false,backlight:true}},
    "binary_sensor.demo_power":{state:"on"}
  }};
  const cr2=document.getElementById("cr2");
  cr2.setConfig({entity:"sensor.vista_partition_1_keypad",model:"6160cr2",read_only:true,indicators:{power:"binary_sensor.demo_power"},function_keys:{a:{text:"AWAY"},b:{text:"STAY"},c:{text:"POLICE"},d:{text:"PAGE"}}}); cr2.hass=hass;
  const k=document.getElementById("k6160");
  k.setConfig({entity:"sensor.vista_partition_1_keypad",model:"6160",read_only:true,function_keys:{a:{text:""},b:{text:""},c:{text:""},d:{text:""}}}); k.hass=hass;
</script>
</body>
</html>
